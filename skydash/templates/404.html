{% extends "base.html" %}
{% block title %}404 &mdash; Page Not Found | {{ site_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="panel state-panel">
        <div class="state-icon"><i class="bi bi-signpost-2"></i></div>
        <div class="state-code">Error 404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Back to dashboard</a>
    </div>
</div>
{% endblock %}
