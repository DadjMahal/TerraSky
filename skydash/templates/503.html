{% extends "base.html" %}
{% block title %}503 &mdash; Server Unavailable | {{ site_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="panel state-panel">
        <div class="state-icon"><i class="bi bi-cloud-slash"></i></div>
        <div class="state-code">Error 503</div>
        <h1>Server temporarily unavailable</h1>
        <p>The server is temporarily unavailable, likely due to maintenance or overload. Please try again in a moment.</p>
        <a href="/" class="btn btn-primary"><i class="bi bi-arrow-clockwise"></i> Retry</a>
    </div>
</div>
{% endblock %}
