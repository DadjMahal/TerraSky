{% extends "base.html" %}
{% block title %}503 — Server Unavailable | {{ site_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="content-card p-5 text-center" style="max-width: 500px;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">🔧</div>
        <h1 class="display-4 fw-bold text-warning">503</h1>
        <h3 class="mb-3">Server Temporarily Unavailable</h3>
        <p class="text-muted mb-4">The server is temporarily unavailable, likely due to maintenance or overload. Please try again in a moment.</p>
        <a href="/" class="btn btn-primary btn-lg">🔄 Retry</a>
    </div>
</div>
{% endblock %}
