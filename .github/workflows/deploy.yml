name: Deploy SkyDash to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Python syntax (pre-deploy gate)
        run: |
          cd skydash
          python3 -m py_compile app.py auth.py config_store.py hermes_agent.py models.py state_reader.py instance_specs.py
          for f in providers/*.py; do
            python3 -m py_compile "$f"
          done
          echo "Syntax validation passed"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${{ secrets.HERMES_SSH_KEY }}" ]; then
            echo "${{ secrets.HERMES_SSH_KEY }}" > ~/.ssh/skydash_hermes
            chmod 600 ~/.ssh/skydash_hermes
          fi

      - name: Sync project files
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            skydash/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/skydash/ \
            --exclude="__pycache__" --exclude="*.pyc" --exclude="venv/" \
            --exclude="*.log" --exclude=".env"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            terraform/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/terraform/ \
            --exclude=".terraform/" --exclude=".env"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            ~/.ssh/skydash_hermes volodro@${{ secrets.SERVER_IP }}:/home/volodro/.ssh/ 2>/dev/null || true
          echo "Files synced"

      - name: Deploy and restart SkyDash
        uses: webfactory/ssh-agent@v0.5.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/volodro/skydash
            
            # Kill existing Flask process
            pkill -f "[a]pp.py" 2>/dev/null || true
            sleep 2
            
            # Load environment variables
            set -a
            source /home/volodro/terraform/.env
            set +a
            
            # Verify Python environment
            echo "=== Verifying Python environment ==="
            venv/bin/python --version
            echo "=== Testing Flask import ==="
            venv/bin/python -c "from app import app; print('Flask app imports OK')"
            
            # Start Flask app
            echo "=== Starting Flask app ==="
            nohup venv/bin/python app.py > flask.log 2>&1 &
            FLASK_PID=$!
            echo "App started with PID $FLASK_PID"
            
            # Wait for app to be ready
            sleep 5
            
            # Check if process is running
            if pgrep -f "[a]pp.py" > /dev/null; then
                echo "✅ Flask process is running"
            else
                echo "❌ Flask process not found"
                cat flask.log
                exit 1
            fi
            
            # Test application directly on 8080
            echo "=== Testing application on port 8080 ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --connect-timeout 5 http://localhost:8080/login
            
            # Health check with retries
            echo "=== Health check ==="
            MAX_RETRIES=10
            for i in $(seq 1 $MAX_RETRIES); do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost:8080/login 2>/dev/null || echo "000")
                echo "Attempt $i: HTTP $CODE"
                if [ "$CODE" = "200" ]; then
                    echo "✅ Deploy successful"
                    # Show sample of deployed content
                    echo "=== Deployed page head ==="
                    curl -s http://localhost:8080/login | head -20
                    exit 0
                fi
                sleep 2
            done
            
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            echo "=== Flask log ==="
            cat flask.log
            exit 1
