name: Deploy SkyDash to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Python syntax (pre-deploy gate)
        run: |
          cd skydash
          python3 -m py_compile app.py auth.py config_store.py hermes_agent.py models.py state_reader.py instance_specs.py
          for f in providers/*.py; do
            python3 -m py_compile "$f"
          done
          echo "Syntax validation passed"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync project files (safe, no --delete)
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            skydash/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/skydash/ \
            --exclude="__pycache__" --exclude="*.pyc" --exclude="venv/" \
            --exclude="*.log" --exclude=".env"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            Documentation/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/Documentation/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            .github/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/.github/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            terraform/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/terraform/ \
            --exclude=".terraform/" --exclude="*.tfstate" --exclude="*.tfstate.*" \
            --exclude=".env"
          echo "Files synced"

      - name: Deploy and restart SkyDash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: volodro
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/volodro/skydash
            set -e  # Fail on any error

            if ! python3 -c "import venv, ensurepip" 2>/dev/null; then
              sudo apt-get install -y python3.12-venv 2>&1 | tail -1
            fi

            # Stop old instance (bracket trick avoids matching this command itself)
            pkill -f "[a]pp.py" 2>/dev/null || true
            sleep 1

            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            # Install from pinned requirements.txt
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
              echo "Dependencies installed"
            else
              echo "::error::requirements.txt missing after sync"
              exit 1
            fi

            # Load environment variables
            if [ -f /home/volodro/terraform/.env ]; then
              set -a
              source /home/volodro/terraform/.env
              set +a
            fi

            # Start app in background
            nohup venv/bin/python app.py > flask.log 2>&1 &
            APP_PID=$!
            echo "App started with PID $APP_PID"

            # Wait for app to be ready
            sleep 6

            # Health check with retries
            for i in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login 2>/dev/null || echo 000)
              echo "Health check attempt $i: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                echo "Deploy successful"
                exit 0
              fi
              sleep 3
            done

            echo "::error::Health check failed after multiple attempts"
            exit 1
