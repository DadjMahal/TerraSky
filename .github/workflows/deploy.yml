name: Deploy SkyDash to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Python syntax (pre-deploy gate)
        run: |
          cd skydash
          python3 -m py_compile app.py auth.py config_store.py hermes_agent.py models.py state_reader.py instance_specs.py
          for f in providers/*.py; do
            python3 -m py_compile "$f"
          done
          echo "Syntax validation passed"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${{ secrets.HERMES_SSH_KEY }}" ]; then
            echo "${{ secrets.HERMES_SSH_KEY }}" > ~/.ssh/skydash_hermes
            chmod 600 ~/.ssh/skydash_hermes
          fi

      - name: Sync project files
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            skydash/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/skydash/ \
            --exclude="__pycache__" --exclude="*.pyc" --exclude="venv/" \
            --exclude="*.log" --exclude=".env"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            terraform/ volodro@${{ secrets.SERVER_IP }}:/home/volodro/terraform/ \
            --exclude=".terraform/" --exclude=".env"
          # Sync nginx reverse-proxy config (routes port 80 -> Flask 8080)
          ssh -i ~/.ssh/deploy_key volodro@${{ secrets.SERVER_IP }} "mkdir -p /home/volodro/deploy/nginx"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            deploy/nginx/skydash.conf volodro@${{ secrets.SERVER_IP }}:/home/volodro/deploy/nginx/skydash.conf
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            ~/.ssh/skydash_hermes volodro@${{ secrets.SERVER_IP }}:/home/volodro/.ssh/ 2>/dev/null || true
          echo "Files synced"

      - name: Configure nginx reverse proxy
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no volodro@${{ secrets.SERVER_IP }} '
            set -e
            echo "=== Installing/updating nginx reverse proxy config ==="
            # Ensure nginx is installed
            sudo apt-get update -y >/dev/null 2>&1 || true
            sudo apt-get install -y nginx >/dev/null 2>&1 || true

            # Install SkyDash site config
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp /home/volodro/deploy/nginx/skydash.conf /etc/nginx/sites-available/skydash.conf
            sudo ln -sf /etc/nginx/sites-available/skydash.conf /etc/nginx/sites-enabled/skydash.conf

            # Remove ALL default/welcome server blocks that could shadow ours.
            sudo rm -f /etc/nginx/sites-enabled/default || true
            sudo rm -f /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default || true
            sudo rm -f /etc/nginx/sites-enabled/000-default || true

            echo "=== Listens on port 80 ==="
            sudo grep -r "listen" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || true

            # Validate config (fail loudly if broken)
            sudo nginx -t 2>&1 || (echo "nginx -t failed"; sudo nginx -T 2>&1 | head -40; exit 1)

            # Reload (try both methods)
            (sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || echo "reload failed") || true

            echo "=== nginx -T (port 80 server blocks) ==="
            sudo nginx -T 2>/dev/null | grep -B1 -A6 "listen 80" | head -60 || true
            echo "✅ nginx configured: port 80 -> Flask 8080"
          '



      - name: Deploy and restart SkyDash
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no volodro@${{ secrets.SERVER_IP }} '
            set -e
            cd /home/volodro/skydash

            echo "=== Stopping existing Flask process ==="
            # [a]pp.py bracket trick so pkill doesn't kill its own command line
            pkill -f "[a]pp.py" 2>/dev/null || true
            sleep 2

            echo "=== Loading environment variables ==="
            set -a
            source /home/volodro/terraform/.env
            set +a

            echo "=== Verifying Python environment ==="
            venv/bin/python --version

            echo "=== Testing Flask import ==="
            venv/bin/python -c "from app import app; print(\"Flask app imports OK\")"

            echo "=== Starting Flask via start_skydash.sh (detached) ==="
            # Use the proven detached startup script rather than inline backgrounding,
            # which keeps the SSH session's stdout open and hangs the step.
            bash /home/volodro/start_skydash.sh
          '



      - name: External public health check (same as browser)
        run: |
          set -e
          echo "=== External check from GitHub runner (public network) ==="
          echo "This mirrors what a browser at https://${{ secrets.SERVER_IP }}/ sees."
          RESP=$(curl -s -o /tmp/ext_body.txt -w "%{http_code}" --connect-timeout 10 \
                "http://${{ secrets.SERVER_IP }}/login" 2>/dev/null || echo "000")
          echo "HTTP code: $RESP"
          echo "--- Response body (first 60 lines) ---"
          head -60 /tmp/ext_body.txt 2>/dev/null || echo "(empty body)"
          if echo "$RESP" | grep -q "200" && grep -qi "skydash" /tmp/ext_body.txt; then
            echo "✅ PUBLIC site serves SkyDash"
          elif echo "$RESP" | grep -q "200" && grep -qi "welcome to nginx\|welcome to" /tmp/ext_body.txt; then
            echo "⚠️ PUBLIC site still shows nginx default page — front proxy/CDN is serving it, not our server"
            echo "   → Must purge CDN cache or fix front proxy config. Check Failure for details."
            exit 1
          else
            echo "⚠️ PUBLIC response does not match expected. Inspect response above."
            exit 1
          fi
